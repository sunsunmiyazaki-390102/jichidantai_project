<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ politician.name }} 公式ページ</title>
    <style>
        /* 🛡️ 動的デザインの核：DBのカラーコードをCSSの基準色に設定 */
        :root {
            --main-color: {{ config.accent_color }};
        }
        
        body { font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; margin: 0; padding: 0; background-color: #f4f6f8; color: #333; }
        .header { background-color: var(--main-color); color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 1.2rem; }
        .hero-image { width: 100%; max-height: 250px; object-fit: cover; display: block; }
        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card-title { color: var(--main-color); font-size: 1.1rem; margin-top: 0; border-bottom: 2px solid var(--main-color); padding-bottom: 5px;}
        
        /* リストの装飾 */
        .doc-list { list-style: none; padding: 0; margin: 0; }
        .doc-list li { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .doc-link { color: #0056b3; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        {{ politician.name }}
    </div>

    {% if config.main_visual %}
    <img src="{{ config.main_visual.url }}" alt="トップ画像" class="hero-image">
    {% endif %}

    <div class="container">
        <div class="card">
            {{ config.welcome_text|linebreaksbr }}
        </div>

        {% if config.show_library %}
        <div class="card">
            <h3 class="card-title">📚 最新の公開資料</h3>
            <ul class="doc-list">
                {% for doc in library_docs %}
                <li>
                    <span style="font-size: 0.8rem; color: #666;">{{ doc.fiscal_year }}年度</span><br>
                    <a href="{{ doc.document_file.url }}" class="doc-link" target="_blank" rel="noopener">{{ doc.title }}</a>
                </li>
                {% empty %}
                <li>現在、公開されている資料はありません。</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
    </div>

</body>
</html>
